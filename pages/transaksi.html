<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Transaksi — Tokku</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
  <script>(function(){if(localStorage.getItem('tokku_theme')==='light')document.documentElement.classList.add('light-theme');})()</script>
</head>
<body>
<div class="app-wrapper">
  <main class="main-content">
    <header class="top-header">
      <button class="icon-btn" onclick="toggleSidebar()"><i class='bx bx-menu'></i></button>
      <div class="header-title">
        <h1>Riwayat Transaksi</h1>
        <p>Semua transaksi penjualan</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" onclick="exportData()"><i class='bx bx-export'></i> Export</button>
      </div>
    </header>
    <div class="page-content">
      <!-- Filter Bar -->
      <div class="card mb-20">
        <div class="card-body" style="padding:16px 20px;">
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
            <div class="form-group" style="margin:0;flex:1;min-width:140px;">
              <label class="form-label">Dari Tanggal</label>
              <input type="date" class="form-control" id="f-start" style="padding:8px 12px;">
            </div>
            <div class="form-group" style="margin:0;flex:1;min-width:140px;">
              <label class="form-label">Sampai Tanggal</label>
              <input type="date" class="form-control" id="f-end" style="padding:8px 12px;">
            </div>
            <div class="form-group" style="margin:0;flex:1;min-width:140px;">
              <label class="form-label">Metode Bayar</label>
              <select class="form-control" id="f-payment">
                <option value="">Semua</option>
                <option value="cash">Tunai</option>
                <option value="transfer">Transfer</option>
                <option value="qris">QRIS</option>
                <option value="credit">Kredit/Hutang</option>
              </select>
            </div>
            <div class="form-group" style="margin:0;flex:1;min-width:120px;">
              <label class="form-label">Status</label>
              <select class="form-control" id="f-status">
                <option value="">Semua</option>
                <option value="completed">Selesai</option>
                <option value="pending">Pending</option>
                <option value="cancelled">Batal</option>
              </select>
            </div>
            <button class="btn btn-primary" onclick="loadTransactions()" style="height:38px;"><i class='bx bx-filter'></i> Filter</button>
            <button class="btn btn-secondary" onclick="resetFilter()" style="height:38px;">Reset</button>
          </div>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="stats-grid mb-20" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat-card" style="--accent-color:var(--brand);--icon-bg:var(--brand-glow);--icon-color:var(--brand-light)">
          <div class="stat-top"><div class="stat-icon"><i class='bx bx-receipt'></i></div></div>
          <div class="stat-value" id="s-count">0</div>
          <div class="stat-label">Total Transaksi</div>
        </div>
        <div class="stat-card" style="--accent-color:var(--success);--icon-bg:var(--success-bg);--icon-color:var(--success)">
          <div class="stat-top"><div class="stat-icon"><i class='bx bx-dollar-circle'></i></div></div>
          <div class="stat-value" id="s-revenue">Rp 0</div>
          <div class="stat-label">Total Pendapatan</div>
        </div>
        <div class="stat-card" style="--accent-color:var(--amber);--icon-bg:var(--amber-glow);--icon-color:var(--amber)">
          <div class="stat-top"><div class="stat-icon"><i class='bx bx-trending-up'></i></div></div>
          <div class="stat-value" id="s-avg">Rp 0</div>
          <div class="stat-label">Rata-rata per Transaksi</div>
        </div>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <div class="table-header">
          <div class="table-title"><i class='bx bx-history' style="color:var(--info);margin-right:6px;"></i>Daftar Transaksi</div>
          <div class="search-bar">
            <div class="search-icon"><i class='bx bx-search'></i></div>
            <input type="text" placeholder="Cari invoice, pelanggan..." id="search-input" oninput="handleSearch(this.value)">
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>No. Invoice</th>
                <th>Pelanggan</th>
                <th>Tanggal & Waktu</th>
                <th>Items</th>
                <th>Metode</th>
                <th>Total</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tx-tbody">
              <tr><td colspan="8"><div class="table-empty"><i class='bx bx-loader-alt'></i><p>Memuat transaksi...</p></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="pagination-wrap">
          <div class="page-info" id="page-info">-</div>
          <div class="page-btns" id="page-btns"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <i class='bx bx-receipt' style="color:var(--brand-light);font-size:22px;"></i>
      <div class="modal-title" id="detail-invoice">Detail Transaksi</div>
      <button class="modal-close" onclick="closeModal('detail-modal')"><i class='bx bx-x'></i></button>
    </div>
    <div class="modal-body" id="detail-body" style="min-height:200px;">
      <div class="table-empty"><i class='bx bx-loader-alt'></i><p>Memuat...</p></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('detail-modal')">Tutup</button>
      <button class="btn btn-primary" onclick="printInvoice()"><i class='bx bx-printer'></i> Cetak</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase.js?v=15"></script>
<script src="../js/app.js?v=15"></script>
<script src="../js/helpers.js?v=15"></script>
<script src="_sidebar.js?v=15"></script>
<script>
let currentPage = 1, perPage = 20, searchTimeout = null, currentTxId = null;

(async () => {
  await requireAuth(); updateSidebarUser(); injectSidebar('transaksi.html');
  // Set default date range: last 30 days
  const today = getToday();
  const start = new Date(); start.setDate(start.getDate() - 30);
  document.getElementById('f-start').value = start.toISOString().split('T')[0];
  document.getElementById('f-end').value = today;
  await loadTransactions();
})();

function handleSearch(v) { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { currentPage=1; loadTransactions(); }, 350); }

async function loadTransactions() {
  const search = document.getElementById('search-input').value.trim();
  const start  = document.getElementById('f-start').value;
  const end    = document.getElementById('f-end').value;
  const pay    = document.getElementById('f-payment').value;
  const status = document.getElementById('f-status').value;

  let q = _sb.from('transactions').select('*,customers(name)', {count:'exact'}).order('created_at', {ascending:false});
  if (start) q = q.gte('created_at', start + 'T00:00:00');
  if (end)   q = q.lte('created_at', end   + 'T23:59:59');
  if (pay)    q = q.eq('payment_method', pay);
  if (status) q = q.eq('status', status);
  if (search) q = q.or(`invoice_no.ilike.%${search}%`);

  const from = (currentPage - 1) * perPage;
  const { data, count } = await q.range(from, from + perPage - 1);
  const rows = data || [];

  // Stats
  const total = rows.reduce((s,t) => s + (t.total||0), 0);
  document.getElementById('s-count').textContent = formatNumber(count||0);
  document.getElementById('s-revenue').textContent = formatCurrency(total);
  document.getElementById('s-avg').textContent = rows.length ? formatCurrency(total / rows.length) : 'Rp 0';

  const tbody = document.getElementById('tx-tbody');
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="8"><div class="table-empty"><i class="bx bx-receipt"></i><p>Tidak ada transaksi ditemukan</p></div></td></tr>'; }
  else {
    tbody.innerHTML = rows.map(t => {
      const payIcons = { cash:'bx-money', transfer:'bx-transfer', qris:'bx-qr', credit:'bx-credit-card' };
      const payLabels = { cash:'Tunai', transfer:'Transfer', qris:'QRIS', credit:'Kredit' };
      const statusBadge = { completed:'badge-success', pending:'badge-warning', cancelled:'badge-danger' };
      return `<tr>
        <td><span class="font-mono td-bold" style="font-size:0.82rem;">${t.invoice_no||'TRX-'+t.id?.slice(0,6)}</span></td>
        <td>${t.customers?.name || '<span class="text-muted">Umum</span>'}</td>
        <td style="font-size:0.82rem;">${formatDate(t.created_at,'datetime')}</td>
        <td>${t.item_count || '-'} item</td>
        <td><span style="display:flex;align-items:center;gap:5px;"><i class='bx ${payIcons[t.payment_method]||"bx-money"}'></i>${payLabels[t.payment_method]||t.payment_method||'-'}</span></td>
        <td class="td-bold text-brand">${formatCurrency(t.total)}</td>
        <td><span class="badge ${statusBadge[t.status]||'badge-neutral'}">${t.status==='completed'?'Selesai':t.status==='pending'?'Pending':'Batal'}</span></td>
        <td>
          <div style="display:flex;gap:4px;">
            <button class="btn btn-secondary btn-icon btn-sm" onclick="viewDetail('${t.id}')" title="Detail"><i class='bx bx-show'></i></button>
            <button class="btn btn-secondary btn-icon btn-sm" onclick="printTx('${t.id}')" title="Cetak"><i class='bx bx-printer'></i></button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  renderPagination(count || 0);
}

function renderPagination(total) {
  const pages = Math.ceil(total / perPage);
  document.getElementById('page-info').textContent = `${formatNumber(total)} transaksi · Hal ${currentPage}/${pages||1}`;
  const btns = document.getElementById('page-btns');
  btns.innerHTML = `
    <button class="page-btn" onclick="changePage(${currentPage-1})" ${currentPage<=1?'disabled':''}><i class='bx bx-chevron-left'></i></button>
    ${Array.from({length:Math.min(5,pages)},(_,i)=>{ const p=Math.max(1,Math.min(currentPage-2,pages-4))+i; return p<=pages?`<button class="page-btn ${p===currentPage?'active':''}" onclick="changePage(${p})">${p}</button>`:''; }).join('')}
    <button class="page-btn" onclick="changePage(${currentPage+1})" ${currentPage>=pages?'disabled':''}><i class='bx bx-chevron-right'></i></button>
  `;
}
function changePage(p) { currentPage = p; loadTransactions(); window.scrollTo(0,0); }

function resetFilter() {
  const today = getToday(); const start = new Date(); start.setDate(start.getDate()-30);
  document.getElementById('f-start').value = start.toISOString().split('T')[0];
  document.getElementById('f-end').value = today;
  document.getElementById('f-payment').value = '';
  document.getElementById('f-status').value = '';
  document.getElementById('search-input').value = '';
  currentPage = 1; loadTransactions();
}

async function viewDetail(id) {
  currentTxId = id;
  document.getElementById('detail-modal').classList.add('active');
  document.getElementById('detail-body').innerHTML = '<div class="table-empty"><i class="bx bx-loader-alt"></i><p>Memuat...</p></div>';
  try {
    const { data: tx } = await _sb.from('transactions').select('*,customers(name,phone)').eq('id', id).single();
    const { data: items } = await _sb.from('transaction_items').select('*,products(name,unit)').eq('transaction_id', id);
    document.getElementById('detail-invoice').textContent = tx.invoice_no || 'Detail Transaksi';
    const payLabels = { cash:'Tunai', transfer:'Transfer', qris:'QRIS', credit:'Kredit/Hutang' };
    document.getElementById('detail-body').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">
        <div><div class="form-label">Pelanggan</div><div class="fw-bold">${tx.customers?.name||'Umum'}</div></div>
        <div><div class="form-label">Tanggal</div><div class="fw-bold">${formatDate(tx.created_at,'datetime')}</div></div>
        <div><div class="form-label">Metode Pembayaran</div><div class="fw-bold">${payLabels[tx.payment_method]||tx.payment_method||'-'}</div></div>
        <div><div class="form-label">Status</div><span class="badge ${tx.status==='completed'?'badge-success':'badge-warning'}">${tx.status==='completed'?'Selesai':'Pending'}</span></div>
      </div>
      <div style="background:var(--bg-elevated);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px;">
        <table style="width:100%;"><thead style="background:var(--bg-hover);">
          <tr><th style="padding:10px 14px;font-size:0.72rem;color:var(--text-muted);">Produk</th><th style="padding:10px 14px;text-align:center;font-size:0.72rem;color:var(--text-muted);">Qty</th><th style="padding:10px 14px;text-align:right;font-size:0.72rem;color:var(--text-muted);">Harga</th><th style="padding:10px 14px;text-align:right;font-size:0.72rem;color:var(--text-muted);">Subtotal</th></tr>
        </thead><tbody>
          ${(items||[]).map(it=>`<tr><td style="padding:10px 14px;font-size:0.845rem;">${it.products?.name||'-'}</td><td style="padding:10px 14px;text-align:center;font-size:0.845rem;">${it.quantity} ${it.products?.unit||'pcs'}</td><td style="padding:10px 14px;text-align:right;font-size:0.845rem;">${formatCurrency(it.price)}</td><td style="padding:10px 14px;text-align:right;font-weight:700;">${formatCurrency(it.subtotal||it.price*it.quantity)}</td></tr>`).join('')}
        </tbody></table>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
        ${tx.discount?`<div style="font-size:0.845rem;color:var(--text-secondary);">Diskon: <span class="text-danger">-${formatCurrency(tx.discount)}</span></div>`:''}
        <div style="font-family:var(--font-display);font-size:1.3rem;font-weight:900;color:var(--brand-light);">Total: ${formatCurrency(tx.total)}</div>
        ${tx.payment_amount?`<div style="font-size:0.845rem;color:var(--text-secondary);">Bayar: ${formatCurrency(tx.payment_amount)} · Kembali: <span class="text-success fw-bold">${formatCurrency(tx.change_amount||0)}</span></div>`:''}
      </div>
    `;
  } catch(e) { document.getElementById('detail-body').innerHTML = '<div class="table-empty"><i class="bx bx-error"></i><p>Gagal memuat detail.</p></div>'; }
}

function printTx(id) { viewDetail(id); }
function printInvoice() { Toast.info('Fitur cetak akan segera tersedia.'); }
function closeModal(id) { document.getElementById(id)?.classList.remove('active'); }
function exportData() { Toast.info('Fitur export Excel akan segera tersedia.'); }
</script>
</body>
</html>
