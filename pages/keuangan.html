<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas Harian — Tokku</title>
  <link rel="manifest" href="../manifest.json">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
  <script>(function(){if(localStorage.getItem('tokku_theme')==='light')document.documentElement.classList.add('light-theme');})()</script>
</head>
<body>
<div class="app-wrapper">
  <main class="main-content">
    <header class="top-header">
      <button class="icon-btn" onclick="toggleSidebar()"><i class='bx bx-menu'></i></button>
      <div class="header-title">
        <h1>Kas Harian</h1>
        <p>Monitor kas masuk & keluar hari ini</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary btn-sm" id="btn-session" onclick="toggleSession()">Buka Kas</button>
      </div>
    </header>

    <div class="page-content">
      <div class="stats-grid mb-20" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat-card">
          <div class="stat-label">Kas Awal</div>
          <div class="stat-value" id="s-opening">Rp 0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Masuk (Sistem)</div>
          <div class="stat-value text-success" id="s-income">Rp 0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Keluar (Sistem)</div>
          <div class="stat-value text-danger" id="s-expense">Rp 0</div>
        </div>
      </div>

      <div class="table-wrap">
        <div class="table-header">
          <div class="table-title">Mutasi Transaksi Hari Ini</div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Waktu</th>
                <th>Keterangan</th>
                <th>Tipe</th>
                <th>Jumlah</th>
              </tr>
            </thead>
            <tbody id="mutation-tbody">
              <tr><td colspan="4" class="table-empty">Belum ada transaksi hari ini</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal Buka/Tutup Kas -->
<div class="modal-overlay" id="session-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="session-title">Buka Kas Baru</div>
      <button class="modal-close" onclick="closeModal('session-modal')"><i class='bx bx-x'></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" id="session-label">Kas Awal (Modal Laci)</label>
        <input type="number" class="form-control" id="session-amount" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Catatan</label>
        <textarea class="form-control" id="session-notes" placeholder="Opsional"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('session-modal')">Batal</button>
      <button class="btn btn-primary" onclick="saveSession()">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js?v=17"></script>
<script src="_sidebar.js"></script>
<script>
let currentSession = null;

(async () => {
  await requireAuth();
  injectSidebar('keuangan.html');
  updateSidebarUser();
  await checkActiveSession();
})();

async function checkActiveSession() {
  const user = getCurrentUser();
  const { data } = await _sb.from('cash_sessions').select('*').eq('user_id', user.id).eq('status', 'open').single();
  currentSession = data;
  
  const btn = document.getElementById('btn-session');
  if (currentSession) {
    btn.textContent = 'Tutup Kas';
    btn.className = 'btn btn-danger btn-sm';
    document.getElementById('s-opening').textContent = formatCurrency(currentSession.opening_balance);
    loadMutations();
  } else {
    btn.textContent = 'Buka Kas';
    btn.className = 'btn btn-primary btn-sm';
  }
}

function toggleSession() {
  if (currentSession) {
    document.getElementById('session-title').textContent = 'Tutup Kas';
    document.getElementById('session-label').textContent = 'Uang Fisik di Laci';
    document.getElementById('session-modal').classList.add('active');
  } else {
    document.getElementById('session-title').textContent = 'Buka Kas Baru';
    document.getElementById('session-label').textContent = 'Kas Awal (Modal Laci)';
    document.getElementById('session-modal').classList.add('active');
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

async function saveSession() {
  const user = getCurrentUser();
  const amount = document.getElementById('session-amount').value;
  const notes = document.getElementById('session-notes').value;

  if (currentSession) {
    // Close session
    await _sb.from('cash_sessions').update({
      closing_time: new Date(),
      closing_balance_actual: amount,
      status: 'closed',
      notes: notes
    }).eq('id', currentSession.id);
  } else {
    // Open session
    await _sb.from('cash_sessions').insert({
      user_id: user.id,
      opening_balance: amount,
      status: 'open',
      notes: notes
    });
  }
  
  closeModal('session-modal');
  checkActiveSession();
}

async function loadMutations() {
  // Mock mutations for now, in real app this would query transactions & expenses
  const { data: txs } = await _sb.from('transactions').select('*').eq('cash_session_id', currentSession.id);
  const tbody = document.getElementById('mutation-tbody');
  if (txs && txs.length > 0) {
    tbody.innerHTML = txs.map(t => `
      <tr>
        <td>${formatDate(t.created_at, 'datetime')}</td>
        <td>Penjualan ${t.invoice_number}</td>
        <td><span class="badge badge-success">Masuk</span></td>
        <td>${formatCurrency(t.total_amount)}</td>
      </tr>
    `).join('');
  }
}
</script>
</body>
</html>
