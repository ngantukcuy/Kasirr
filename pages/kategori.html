<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategori — KASIRKU</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=6">
  <style>
    .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .category-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; gap: 12px; transition: var(--transition); }
    .category-card:hover { border-color: var(--accent-border); }
    .cat-icon-wrap { width: 52px; height: 52px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 28px; max-width: 440px; width: 100%; }
    .color-picker-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: var(--transition); }
    .color-dot.selected { border-color: #fff; transform: scale(1.15); }
  </style>
</head>
<body>
<div class="app-wrapper">
    <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <a href="dashboard.html" class="sidebar-brand">
      <div class="brand-icon"><i class='bx bx-store-alt'></i></div>
      <div class="brand-name">KASIR<em>KU</em></div>
    </a>
    <nav class="sidebar-nav">
      <div class="nav-section">Utama</div>
      <a href="dashboard.html" class="nav-item"><i class='bx bxs-dashboard'></i> Dashboard</a>
      <a href="kasir.html" class="nav-item"><i class='bx bx-receipt'></i> Kasir POS <span class="nav-badge">HOT</span></a>
      <a href="transaksi.html" class="nav-item"><i class='bx bx-list-ul'></i> Riwayat Transaksi</a>
      <div class="nav-section">Inventori</div>
      <a href="produk.html" class="nav-item"><i class='bx bx-package'></i> Produk & Stok</a>
      <a href="kategori.html" class="nav-item active"><i class='bx bx-folder-open'></i> Kategori</a>
      <a href="stok.html" class="nav-item"><i class='bx bx-stats'></i> Monitor Stok</a>
      <a href="laporan-stok.html" class="nav-item"><i class="bx bx-trending-up"></i> Laporan Stok</a>
      <div class="nav-section">Pelanggan</div>
      <a href="pelanggan.html" class="nav-item"><i class='bx bx-group'></i> Pelanggan</a>
      <div class="nav-section">Laporan</div>
      <a href="laporan.html" class="nav-item"><i class='bx bx-bar-chart-alt-2'></i> Laporan Penjualan</a>
      <div class="nav-section">Pengaturan</div>
      <a href="pengguna.html" class="nav-item"><i class='bx bx-user-circle'></i> Manajemen User</a>
      <a href="pengaturan.html" class="nav-item"><i class='bx bx-cog'></i> Pengaturan Toko</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">A</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Loading...</div>
          <div class="user-role" id="user-role">-</div>
        </div>
        <button class="btn-logout" onclick="handleLogout()" title="Keluar">
          <i class='bx bx-log-out'></i>
        </button>
      </div>
    </div>
  </aside>
  <main class="main-content">
    <header class="top-header">
      <button class="icon-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
        <i class='bx bx-menu' style="font-size:22px;"></i>
      </button>
      <div class="header-title"><h1>Kategori Produk</h1><p id="cat-count">Memuat...</p></div>
      <div class="header-actions">
        <button class="btn btn-primary btn-sm" onclick="openModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambah Kategori
        </button>
      </div>
    </header>

    <div class="page-content">
      <div id="category-grid" class="category-grid">
        <div style="text-align:center; padding:40px; color:var(--text-muted); grid-column:1/-1;">Memuat kategori...</div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div id="cat-modal" class="modal-backdrop" style="display:none;">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <span style="font-family:var(--font-display); font-size:1.1rem; font-weight:700;" id="modal-title">Tambah Kategori</span>
      <button class="icon-btn" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="form-group">
      <label class="form-label">Nama Kategori <span class="required">*</span></label>
      <input type="text" id="f-name" class="form-control" placeholder="Semen & Beton">
    </div>
    <div class="form-group">
      <label class="form-label">Ikon (Emoji)</label>
      <input type="text" id="f-icon" class="form-control" placeholder="🏗️" maxlength="4">
    </div>
    <div class="form-group">
      <label class="form-label">Warna</label>
      <div class="color-picker-row" id="color-picker"></div>
      <input type="hidden" id="f-color" value="#f97316">
    </div>
    <div class="form-group">
      <label class="form-label">Deskripsi</label>
      <input type="text" id="f-description" class="form-control" placeholder="Deskripsi singkat...">
    </div>
    <div style="display:flex; gap:10px; margin-top:20px; justify-content:flex-end;">
      <button class="btn" onclick="closeModal()" style="background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-secondary);">Batal</button>
      <button class="btn btn-primary" id="btn-save" onclick="saveCategory()">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase.js?v=13"></script>
<script src="_sidebar.js?v=13"></script>
<script src="../js/app.js?v=13"></script>
<script>
  let categories = [];
  let editingId = null;

  async function init() {
    const ok = await requireAuth('kategori');
    if (!ok) return;
    // Render color picker dots
    const colors = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#64748b','#0891b2','#059669','#7c3aed'];
    document.getElementById('color-picker').innerHTML = colors.map(c =>
      `<div class="color-dot" style="background:${c};" data-color="${c}" onclick="selectColor('${c}')"></div>`
    ).join('');
    selectColor('#f97316');
    await loadCategories();
  }

  async function loadCategories() {
    try {
      categories = await KasirkuDB.Categories.getAll();
      renderGrid();
      document.getElementById('cat-count').textContent = `${categories.length} kategori`;
    } catch(e) { Toast.error('Gagal memuat kategori'); }
  }

  function renderGrid() {
    const grid = document.getElementById('category-grid');
    if (!categories.length) {
      grid.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted); grid-column:1/-1;">Belum ada kategori</div>`;
      return;
    }
    grid.innerHTML = categories.map(c => `<div class="category-card">
      <div class="cat-icon-wrap" style="background:${c.color}22;">${c.icon || '📦'}</div>
      <div>
        <div style="font-weight:700; margin-bottom:2px;">${c.name}</div>
        ${c.description ? `<div style="font-size:0.78rem; color:var(--text-muted);">${c.description}</div>` : ''}
      </div>
      <div style="display:flex; gap:8px; margin-top:4px;">
        <button class="btn btn-sm" onclick="openModal('${c.id}')" style="flex:1; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-secondary); font-size:0.78rem;">Edit</button>
        <button class="btn btn-sm" onclick="deleteCategory('${c.id}','${c.name.replace(/'/g,"\\'")}') " style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.2); color:#ef4444; font-size:0.78rem; padding:0 10px;">🗑</button>
      </div>
    </div>`).join('');
  }

  function selectColor(color) {
    document.getElementById('f-color').value = color;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.toggle('selected', d.dataset.color === color));
  }

  function openModal(id = null) {
    editingId = id;
    document.getElementById('modal-title').textContent = id ? 'Edit Kategori' : 'Tambah Kategori';
    if (id) {
      const c = categories.find(x => x.id === id);
      if (c) {
        document.getElementById('f-name').value = c.name || '';
        document.getElementById('f-icon').value = c.icon || '';
        document.getElementById('f-description').value = c.description || '';
        selectColor(c.color || '#f97316');
      }
    } else {
      document.getElementById('f-name').value = '';
      document.getElementById('f-icon').value = '';
      document.getElementById('f-description').value = '';
      selectColor('#f97316');
    }
    document.getElementById('cat-modal').style.display = 'flex';
  }

  function closeModal() { document.getElementById('cat-modal').style.display = 'none'; editingId = null; }

  async function saveCategory() {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { Toast.error('Nama kategori wajib diisi'); return; }
    const data = { name, icon: document.getElementById('f-icon').value.trim() || '📦', color: document.getElementById('f-color').value, description: document.getElementById('f-description').value.trim() || null };
    const btn = document.getElementById('btn-save');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    try {
      if (editingId) { await KasirkuDB.Categories.update(editingId, data); Toast.success('Kategori diperbarui'); }
      else { await KasirkuDB.Categories.create(data); Toast.success('Kategori ditambahkan'); }
      closeModal(); await loadCategories();
    } catch(e) { Toast.error(e.message || 'Gagal menyimpan');
    } finally { btn.disabled = false; btn.textContent = 'Simpan'; }
  }

  function deleteCategory(id, name) {
    Modal.confirm('Hapus Kategori', `Yakin hapus kategori "${name}"? Produk yang menggunakan kategori ini tidak akan terhapus.`, async () => {
      try { await KasirkuDB.Categories.delete(id); Toast.success('Kategori dihapus'); await loadCategories(); }
      catch(e) { Toast.error('Gagal menghapus kategori'); }
    });
  }

  init();
</script>

  <div id="sidebar-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:199;" onclick="closeSidebar()"></div>
</body>
</html>
