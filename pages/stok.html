<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Stok — Tokku</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tokku">
  <meta name="theme-color" content="#7af957">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
  <style>
    .stok-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .stok-table th { padding: 10px 14px; text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); border-bottom: 1px solid var(--border); background: var(--bg-tertiary); }
    .stok-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .stok-table tr:hover td { background: var(--bg-elevated); }
    .stock-bar-wrap { display: flex; align-items: center; gap: 8px; }
    .stock-bar { height: 6px; border-radius: 3px; background: var(--bg-elevated); overflow: hidden; width: 80px; }
    .stock-bar-fill { height: 100%; border-radius: 3px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 28px; max-width: 440px; width: 100%; }
  
    @media (max-width: 768px) {
      .filter-bar { flex-direction: column; gap: 8px; }
      .filter-bar > * { width: 100% !important; }
      /* Hide table on mobile, show cards */
      .stok-table-wrap { display: none; }
      .stok-card-list { display: flex; flex-direction: column; gap: 10px; }
    }
    @media (min-width: 769px) {
      /* Hide cards on desktop, show table */
      .stok-card-list { display: none; }
      .stok-table-wrap { display: block; }
    }
    .stok-product-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .stok-card-row { display: flex; justify-content: space-between; align-items: center; }
    .stok-card-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stok-card-val { font-size: 0.875rem; color: var(--text-primary); font-weight: 500; }
  </style>
  <script>
    // Init theme sebelum render untuk hindari flash
    (function() {
      if (localStorage.getItem('tokku_theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      } else {
        document.documentElement.classList.remove('light-theme');
      }
      // Dengarkan perubahan tema dari tab/halaman lain (pengaturan)
      window.addEventListener('storage', function(e) {
        if (e.key === 'tokku_theme') {
          if (e.newValue === 'light') {
            document.documentElement.classList.add('light-theme');
          } else {
            document.documentElement.classList.remove('light-theme');
          }
        }
      });
      // BroadcastChannel untuk sinkronisasi tema antar halaman di tab yang sama
      try {
        var _themeChannel = new BroadcastChannel('tokku_theme_channel');
        _themeChannel.onmessage = function(e) {
          if (e.data && e.data.theme === 'light') {
            document.documentElement.classList.add('light-theme');
          } else {
            document.documentElement.classList.remove('light-theme');
          }
        };
      } catch(e) {}
    })();
  </script>

  <style>
    /* Tokku v2 patch — override legacy CSS vars */
    :root {
      --accent: var(--brand);
      --accent-light: var(--brand-light);
      --accent-glow: var(--brand-glow);
      --accent-border: var(--brand-border);
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --bg-primary: var(--bg-base);
      --bg-secondary: var(--bg-surface);
      --bg-tertiary: var(--bg-elevated);
      --bg-card: var(--bg-card);
      --success-bg: var(--success-bg);
      --warning-bg: var(--warning-bg);
      --danger-bg: var(--danger-bg);
      --info-bg: var(--info-bg);
      --border-strong: var(--border-md);
    }
  </style>
</head>
<body>
<div class="app-wrapper">
    <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <!-- nav injected -->
  <main class="main-content">
    <header class="top-header">
      <button class="icon-btn" onclick="toggleSidebar()"><i class='bx bx-menu'></i></button>
      <div class="header-title"><h1>Monitor Stok</h1><p id="stok-count">Memuat...</p></div>
      <div class="header-actions">
        <button class="btn btn-primary btn-sm" onclick="openAdjustModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Penyesuaian Stok
        </button>
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle tema"><i class='bx bx-moon'></i></button>
        </div>
    </header>

    <div class="page-content">
      <!-- Alert Summary -->
      <div id="alert-banner" style="display:none; background:rgba(249,115,22,0.1); border:1px solid rgba(249,115,22,0.3); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:12px;">
        <span style="font-size:1.4rem;">⚠️</span>
        <span id="alert-text" style="font-size:0.875rem; color:var(--text-secondary);"></span>
      </div>

      <!-- Filter tabs -->
      <div style="display:flex; gap:8px; margin-bottom:16px; background:var(--bg-tertiary); border-radius:var(--radius-md); padding:3px; width:fit-content;">
        <button class="tab-btn active" id="tab-all" onclick="filterStok('all')">Semua Produk</button>
        <button class="tab-btn" id="tab-low" onclick="filterStok('low')">⚠️ Stok Rendah</button>
        <button class="tab-btn" id="tab-empty" onclick="filterStok('empty')">❌ Habis</button>
      </div>

      <div class="card" style="padding:0; overflow:hidden;">
        <div class="stok-table-wrap" style="overflow-x:auto;">
          <table class="stok-table">
            <thead>
              <tr>
                <th>Produk</th>
                <th>Kategori</th>
                <th>Stok Saat Ini</th>
                <th>Min. Stok</th>
                <th>Level</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="stok-tbody">
              <tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-muted);">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="stok-card-list" id="stok-cardlist" style="padding:12px;">
          <div style="text-align:center; padding:20px; color:var(--text-muted);">Memuat data...</div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Adjust Stock Modal -->
<div id="adjust-modal" class="modal-backdrop" style="display:none;">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <span style="font-family:var(--font-display); font-size:1.1rem; font-weight:700;">Penyesuaian Stok</span>
      <button class="icon-btn" onclick="closeAdjustModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="form-group">
      <label class="form-label">Produk <span class="required">*</span></label>
      <select id="adj-product" class="form-control"><option value="">-- Pilih Produk --</option></select>
    </div>
    <div class="form-group">
      <label class="form-label">Tipe Penyesuaian</label>
      <div style="display:flex; gap:8px;">
        <label style="flex:1; display:flex; align-items:center; gap:8px; padding:10px 12px; border:1.5px solid var(--border); border-radius:var(--radius-md); cursor:pointer;" id="type-in-label">
          <input type="radio" name="adj-type" value="in" checked onchange="updateTypeStyle()"> 
          <span style="font-size:0.875rem; font-weight:600;">➕ Stok Masuk</span>
        </label>
        <label style="flex:1; display:flex; align-items:center; gap:8px; padding:10px 12px; border:1.5px solid var(--border); border-radius:var(--radius-md); cursor:pointer;" id="type-out-label">
          <input type="radio" name="adj-type" value="out" onchange="updateTypeStyle()">
          <span style="font-size:0.875rem; font-weight:600;">➖ Stok Keluar</span>
        </label>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Jumlah <span class="required">*</span></label>
      <input type="number" id="adj-qty" class="form-control" placeholder="0" min="1" step="0.5">
    </div>
    <div class="form-group">
      <label class="form-label">Keterangan</label>
      <input type="text" id="adj-notes" class="form-control" placeholder="Alasan penyesuaian...">
    </div>
    <div style="display:flex; gap:10px; margin-top:20px; justify-content:flex-end;">
      <button class="btn" onclick="closeAdjustModal()" style="background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-secondary);">Batal</button>
      <button class="btn btn-primary" id="btn-adj" onclick="saveAdjustment()">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase.js?v=15"></script>
<script src="_sidebar.js?v=15"></script>
<script src="../js/app.js?v=15"></script>
<script>
  let allProducts = [];
  let currentFilter = 'all';

  const tabStyle = { active: 'background:var(--bg-elevated); color:var(--text-primary); padding:7px 14px; border:none; border-radius:calc(var(--radius-md) - 2px); font-weight:600; font-size:0.8rem; cursor:pointer; font-family:inherit;', inactive: 'background:transparent; color:var(--text-muted); padding:7px 14px; border:none; border-radius:calc(var(--radius-md) - 2px); font-weight:600; font-size:0.8rem; cursor:pointer; font-family:inherit;' };

  async function init() {
    const ok = await requireAuth('stok');
    if (!ok) return;
    await loadData();
  }

  async function loadData() {
    try {
      allProducts = await KasirkuDB.Products.getAll();
      // Populate product select
      const sel = document.getElementById('adj-product');
      sel.innerHTML = '<option value="">-- Pilih Produk --</option>' + allProducts.map(p => `<option value="${p.id}">${p.name} (Stok: ${p.stock} ${p.unit})</option>`).join('');
      renderTable();
      updateAlertBanner();
    } catch(e) { Toast.error('Gagal memuat data stok'); }
  }

  function filterStok(f) {
    currentFilter = f;
    ['all','low','empty'].forEach(id => {
      const btn = document.getElementById('tab-' + id);
      btn.style.cssText = id === f ? tabStyle.active : tabStyle.inactive;
    });
    renderTable();
  }

  function renderTable() {
    let products = allProducts;
    if (currentFilter === 'low') products = products.filter(p => p.stock > 0 && p.stock <= p.min_stock);
    if (currentFilter === 'empty') products = products.filter(p => p.stock <= 0);
    document.getElementById('stok-count').textContent = `${products.length} produk`;

    const tbody = document.getElementById('stok-tbody');
    const cardlist = document.getElementById('stok-cardlist');
    if (!products.length) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-muted);">Tidak ada produk</td></tr>`;
      cardlist.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">Tidak ada produk</div>`;
      return;
    }
    const rows = products.map(p => {
      const status = getStockStatus(p.stock, p.min_stock);
      const colorMap = { 'stock-ok': '#22c55e', 'stock-warning': '#eab308', 'stock-low': '#f59e0b', 'stock-empty': '#ef4444' };
      const fillColor = colorMap[status.cls] || '#22c55e';
      const pct = p.min_stock > 0 ? Math.min(100, (p.stock / (p.min_stock * 3)) * 100) : 100;
      const cat = p.categories;
      return { p, status, fillColor, pct, cat };
    });

    tbody.innerHTML = rows.map(({ p, status, fillColor, pct, cat }) => `<tr>
        <td><div style="display:flex; align-items:center; gap:10px;">
          <div style="width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:${cat?.color ? cat.color + '20' : 'var(--bg-elevated)'};">${cat?.icon || '📦'}</div>
          <div><div style="font-weight:600; font-size:0.875rem;">${p.name}</div>${p.barcode ? `<div style="font-size:0.72rem; color:var(--text-muted);">${p.barcode}</div>` : ''}</div>
        </div></td>
        <td style="color:var(--text-muted);">${cat?.name || '—'}</td>
        <td><span style="font-family:var(--font-display); font-weight:700; font-size:1rem; color:${fillColor};">${formatNumber(p.stock)}</span> <span style="font-size:0.78rem; color:var(--text-muted);">${p.unit}</span></td>
        <td style="color:var(--text-muted);">${formatNumber(p.min_stock)} ${p.unit}</td>
        <td><div class="stock-bar-wrap">
          <div class="stock-bar"><div class="stock-bar-fill" style="width:${pct}%; background:${fillColor};"></div></div>
          <span style="font-size:0.72rem; font-weight:700; color:${fillColor};">${status.label}</span>
        </div></td>
        <td><button class="btn btn-sm" onclick="quickAdjust('${p.id}')" style="background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-secondary); font-size:0.75rem; padding:4px 10px;">Sesuaikan</button></td>
      </tr>`).join('');

    cardlist.innerHTML = rows.map(({ p, status, fillColor, pct, cat }) => `
      <div class="stok-product-card">
        <div class="stok-card-row">
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; background:${cat?.color ? cat.color + '20' : 'var(--bg-elevated)'};">${cat?.icon || '📦'}</div>
            <div>
              <div style="font-weight:700; font-size:0.9rem;">${p.name}</div>
              <div style="font-size:0.72rem; color:var(--text-muted);">${cat?.name || '—'}${p.barcode ? ' · ' + p.barcode : ''}</div>
            </div>
          </div>
          <span style="font-size:0.72rem; font-weight:700; color:${fillColor}; background:${fillColor}18; padding:3px 8px; border-radius:99px;">${status.label}</span>
        </div>
        <div style="height:6px; border-radius:3px; background:var(--bg-elevated); overflow:hidden;">
          <div style="width:${pct}%; height:100%; border-radius:3px; background:${fillColor};"></div>
        </div>
        <div class="stok-card-row">
          <div>
            <div class="stok-card-label">Stok Saat Ini</div>
            <div style="font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:${fillColor};">${formatNumber(p.stock)} <span style="font-size:0.78rem; font-weight:400; color:var(--text-muted);">${p.unit}</span></div>
          </div>
          <div style="text-align:center;">
            <div class="stok-card-label">Min. Stok</div>
            <div class="stok-card-val">${formatNumber(p.min_stock)} ${p.unit}</div>
          </div>
          <button class="btn btn-sm" onclick="quickAdjust('${p.id}')" style="background:var(--accent); border:none; color:#fff; font-size:0.75rem; padding:6px 14px; border-radius:8px;">Sesuaikan</button>
        </div>
      </div>`).join('');
  }

  function updateAlertBanner() {
    const lowStock = allProducts.filter(p => p.stock <= p.min_stock);
    const banner = document.getElementById('alert-banner');
    if (lowStock.length > 0) {
      document.getElementById('alert-text').textContent = `${lowStock.length} produk membutuhkan perhatian — stok menipis atau habis.`;
      banner.style.display = 'flex';
    } else {
      banner.style.display = 'none';
    }
  }

  function openAdjustModal() { document.getElementById('adjust-modal').style.display = 'flex'; }
  function closeAdjustModal() { document.getElementById('adjust-modal').style.display = 'none'; }

  function quickAdjust(productId) {
    document.getElementById('adj-product').value = productId;
    openAdjustModal();
  }

  function updateTypeStyle() { /* visual feedback done by radio */ }

  async function saveAdjustment() {
    const productId = document.getElementById('adj-product').value;
    const type = document.querySelector('input[name="adj-type"]:checked').value;
    const qty = parseFloat(document.getElementById('adj-qty').value);
    const notes = document.getElementById('adj-notes').value.trim();
    if (!productId) { Toast.error('Pilih produk terlebih dahulu'); return; }
    if (!qty || qty <= 0) { Toast.error('Jumlah harus lebih dari 0'); return; }
    const btn = document.getElementById('btn-adj');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    try {
      const newStock = await KasirkuDB.Products.adjustStock(productId, qty, type, notes);
      Toast.success(`Stok berhasil disesuaikan. Stok baru: ${newStock}`);
      closeAdjustModal();
      document.getElementById('adj-qty').value = '';
      document.getElementById('adj-notes').value = '';
      await loadData();
    } catch(e) { Toast.error(e.message || 'Gagal menyesuaikan stok');
    } finally { btn.disabled = false; btn.textContent = 'Simpan'; }
  }

  // Init tab styles
  ['all','low','empty'].forEach(id => {
    const btn = document.getElementById('tab-' + id);
    if (btn) btn.style.cssText = id === 'all' ? tabStyle.active : tabStyle.inactive;
  });

  init();
</script>

  <div id="sidebar-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:199;" onclick="closeSidebar()"></div>
</body>
</html>
