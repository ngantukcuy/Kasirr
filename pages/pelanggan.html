<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelanggan — Tokku</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
  <script>(function(){if(localStorage.getItem('tokku_theme')==='light')document.documentElement.classList.add('light-theme');})()</script>
</head>
<body>
<div class="app-wrapper">
  <main class="main-content">
    <header class="top-header">
      <button class="icon-btn" onclick="toggleSidebar()"><i class='bx bx-menu'></i></button>
      <div class="header-title"><h1>Pelanggan</h1><p>Kelola data pelanggan & piutang</p></div>
      <div class="header-actions">
        <button class="btn btn-primary btn-sm" onclick="openModal()"><i class='bx bx-plus'></i> Tambah Pelanggan</button>
      </div>
    </header>
    <div class="page-content">
      <div class="table-wrap">
        <div class="table-header">
          <div class="table-title"><i class='bx bx-group' style="color:var(--info);margin-right:6px;"></i>Data Pelanggan</div>
          <div class="search-bar">
            <div class="search-icon"><i class='bx bx-search'></i></div>
            <input type="text" placeholder="Cari nama, telepon..." id="search-input" oninput="handleSearch(this.value)">
          </div>
          <select class="form-control" style="width:140px;" id="f-type" onchange="loadCustomers()">
            <option value="">Semua Tipe</option>
            <option value="retail">Retail</option>
            <option value="toko">Toko</option>
            <option value="perusahaan">Perusahaan</option>
          </select>
        </div>
        <div class="table-scroll">
          <table>
            <thead><tr>
              <th>Pelanggan</th><th>Telepon</th><th>Tipe</th><th>Limit Hutang</th><th>Saldo Deposit</th><th>Total Transaksi</th><th>Aksi</th>
            </tr></thead>
            <tbody id="customer-tbody"><tr><td colspan="7"><div class="table-empty"><i class='bx bx-loader-alt'></i><p>Memuat...</p></div></td></tr></tbody>
          </table>
        </div>
        <div class="pagination"><div class="page-info" id="page-info">-</div><div class="page-btns" id="page-btns"></div></div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="customer-modal">
  <div class="modal">
    <div class="modal-header">
      <i class='bx bx-user-plus' style="color:var(--brand-light);font-size:22px;"></i>
      <div class="modal-title" id="modal-title">Tambah Pelanggan</div>
      <button class="modal-close" onclick="closeModal()"><i class='bx bx-x'></i></button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group" style="grid-column:span 2;">
          <label class="form-label">Nama <span class="required">*</span></label>
          <input type="text" class="form-control" id="c-name" placeholder="Nama pelanggan">
        </div>
        <div class="form-group">
          <label class="form-label">No. Telepon</label>
          <input type="text" class="form-control" id="c-phone" placeholder="08xx-xxxx-xxxx">
        </div>
        <div class="form-group">
          <label class="form-label">Tipe Pelanggan</label>
          <select class="form-control" id="c-type">
            <option value="retail">Retail</option>
            <option value="toko">Toko</option>
            <option value="perusahaan">Perusahaan</option>
          </select>
        </div>
        <div class="form-group" style="grid-column:span 2;">
          <label class="form-label">Alamat</label>
          <textarea class="form-control" id="c-address" placeholder="Alamat lengkap" style="min-height:60px;"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Limit Hutang (Rp)</label>
          <input type="number" class="form-control" id="c-debt-limit" placeholder="0 = tidak ada limit">
        </div>
        <div class="form-group">
          <label class="form-label">Tempo Pembayaran (hari)</label>
          <input type="number" class="form-control" id="c-payment-term" placeholder="0 = bayar langsung">
        </div>
        <div class="form-group" style="grid-column:span 2;">
          <label class="form-label">Catatan</label>
          <input type="text" class="form-control" id="c-notes" placeholder="Catatan tambahan...">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" id="btn-save" onclick="saveCustomer()"><i class='bx bx-save'></i> Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase.js?v=15"></script>
<script src="../js/app.js?v=15"></script>
<script src="../js/helpers.js?v=16"></script>
<script src="_sidebar.js?v=15"></script>
<script>
let currentPage=1, perPage=20, editingId=null, searchTimeout=null;

(async()=>{ await requireAuth(); updateSidebarUser(); injectSidebar('pelanggan.html'); await loadCustomers(); })();

function handleSearch(v) { clearTimeout(searchTimeout); searchTimeout=setTimeout(()=>{currentPage=1;loadCustomers();},350); }

async function loadCustomers() {
  const search = document.getElementById('search-input').value.trim();
  const type   = document.getElementById('f-type').value;
  let q = _sb.from('customers').select('*',{count:'exact'}).order('name');
  if (search) q = q.or(`name.ilike.%${search}%,phone.ilike.%${search}%`);
  if (type) q = q.eq('customer_type', type);
  const from = (currentPage-1)*perPage;
  const { data, count } = await q.range(from, from+perPage-1);
  const rows = data || [];
  document.getElementById('page-info').textContent = `${formatNumber(count||0)} pelanggan`;
  const tbody = document.getElementById('customer-tbody');
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="7"><div class="table-empty"><i class="bx bx-group"></i><p>Tidak ada pelanggan</p></div></td></tr>'; return; }
  tbody.innerHTML = rows.map(c => {
    const typeColors = { retail:'badge-brand', toko:'badge-amber', perusahaan:'badge-purple' };
    const typeLabels = { retail:'Retail', toko:'Toko', perusahaan:'Perusahaan' };
    return `<tr>
      <td>
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:36px;height:36px;border-radius:var(--r-md);background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:0.9rem;flex-shrink:0;">${c.name?.charAt(0)||'?'}</div>
          <div><div class="td-bold">${c.name}</div>${c.address?`<div style="font-size:0.72rem;color:var(--text-muted);">${c.address}</div>`:''}</div>
        </div>
      </td>
      <td>${c.phone||'-'}</td>
      <td><span class="badge ${typeColors[c.customer_type]||'badge-neutral'}">${typeLabels[c.customer_type]||c.customer_type||'-'}</span></td>
      <td>${c.debt_limit?formatCurrency(c.debt_limit):'<span class="text-muted">Tidak ada</span>'}</td>
      <td>${c.deposit_balance?formatCurrency(c.deposit_balance):'Rp 0'}</td>
      <td>${c.total_transactions?formatNumber(c.total_transactions)+' tx':'0 tx'}</td>
      <td>
        <div style="display:flex;gap:4px;">
          <button class="btn btn-secondary btn-icon btn-sm" onclick="editCustomer('${c.id}')" title="Edit"><i class='bx bx-edit'></i></button>
          <button class="btn btn-icon btn-sm" style="background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bg);" onclick="deleteCustomer('${c.id}','${c.name?.replace(/'/g,"\\'")}')"><i class='bx bx-trash'></i></button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function openModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Tambah Pelanggan';
  ['c-name','c-phone','c-address','c-debt-limit','c-payment-term','c-notes'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
  document.getElementById('c-type').value = 'retail';
  document.getElementById('customer-modal').classList.add('active');
}

function editCustomer(id) {
  _sb.from('customers').select('*').eq('id',id).single().then(({data:c})=>{
    if (!c) return;
    editingId = id;
    document.getElementById('modal-title').textContent = 'Edit Pelanggan';
    document.getElementById('c-name').value = c.name||'';
    document.getElementById('c-phone').value = c.phone||'';
    document.getElementById('c-address').value = c.address||'';
    document.getElementById('c-type').value = c.customer_type||'retail';
    document.getElementById('c-debt-limit').value = c.debt_limit||'';
    document.getElementById('c-payment-term').value = c.payment_term||'';
    document.getElementById('c-notes').value = c.notes||'';
    document.getElementById('customer-modal').classList.add('active');
  });
}

async function saveCustomer() {
  const name = document.getElementById('c-name').value.trim();
  if (!name) { Toast.error('Nama pelanggan wajib diisi.'); return; }
  const btn = document.getElementById('btn-save');
  btn.disabled=true; btn.innerHTML='<div class="spin"></div> Menyimpan...';
  const payload = {
    name, phone: document.getElementById('c-phone').value||null,
    address: document.getElementById('c-address').value||null,
    customer_type: document.getElementById('c-type').value,
    debt_limit: parseFloat(document.getElementById('c-debt-limit').value)||null,
    payment_term: parseInt(document.getElementById('c-payment-term').value)||0,
    notes: document.getElementById('c-notes').value||null,
  };
  try {
    if (editingId) { await _sb.from('customers').update(payload).eq('id',editingId); Toast.success('Pelanggan diperbarui!'); }
    else { await _sb.from('customers').insert(payload); Toast.success('Pelanggan ditambahkan!'); }
    closeModal(); loadCustomers();
  } catch(e) { Toast.error(e.message||'Gagal menyimpan.'); }
  finally { btn.disabled=false; btn.innerHTML='<i class="bx bx-save"></i> Simpan'; }
}

function deleteCustomer(id, name) {
  Modal.confirm('Hapus Pelanggan', `Yakin hapus <strong>${name}</strong>?`, async ()=>{
    try { await _sb.from('customers').delete().eq('id',id); Toast.success('Pelanggan dihapus.'); loadCustomers(); }
    catch(e) { Toast.error(e.message||'Gagal menghapus.'); }
  });
}

function closeModal() { document.getElementById('customer-modal')?.classList.remove('active'); }
</script>
</body>
</html>
