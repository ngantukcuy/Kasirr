<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utang & Piutang — Tokku</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
  <script>(function(){if(localStorage.getItem('tokku_theme')==='light')document.documentElement.classList.add('light-theme');})()</script>
</head>
<body>
<div class="app-wrapper">
  <main class="main-content">
    <header class="top-header">
      <button class="icon-btn" onclick="toggleSidebar()"><i class='bx bx-menu'></i></button>
      <div class="header-title"><h1>Utang &amp; Piutang</h1><p>Monitor hutang supplier &amp; piutang pelanggan</p></div>
      <div class="header-actions">
        <button class="btn btn-primary btn-sm" onclick="openModal()"><i class='bx bx-plus'></i> Catat Baru</button>
      </div>
    </header>
    <div class="page-content">
      <!-- Summary -->
      <div class="stats-grid mb-20" style="grid-template-columns:repeat(4,1fr);">
        <div class="stat-card" style="--accent-color:var(--danger);--icon-bg:var(--danger-bg);--icon-color:var(--danger)">
          <div class="stat-top"><div class="stat-icon"><i class='bx bx-trending-down'></i></div></div>
          <div class="stat-value" id="s-utang">Rp 0</div>
          <div class="stat-label">Total Utang</div>
        </div>
        <div class="stat-card" style="--accent-color:var(--success);--icon-bg:var(--success-bg);--icon-color:var(--success)">
          <div class="stat-top"><div class="stat-icon"><i class='bx bx-trending-up'></i></div></div>
          <div class="stat-value" id="s-piutang">Rp 0</div>
          <div class="stat-label">Total Piutang</div>
        </div>
        <div class="stat-card" style="--accent-color:var(--warning);--icon-bg:var(--warning-bg);--icon-color:var(--warning)">
          <div class="stat-top"><div class="stat-icon"><i class='bx bx-time'></i></div></div>
          <div class="stat-value" id="s-overdue">0</div>
          <div class="stat-label">Jatuh Tempo</div>
        </div>
        <div class="stat-card" style="--accent-color:var(--info);--icon-bg:var(--info-bg);--icon-color:var(--info)">
          <div class="stat-top"><div class="stat-icon"><i class='bx bx-check-double'></i></div></div>
          <div class="stat-value" id="s-lunas">0</div>
          <div class="stat-label">Lunas Bulan Ini</div>
        </div>
      </div>

      <!-- Tabs -->
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button class="btn btn-primary btn-sm tab-btn" data-tab="piutang" onclick="switchTab('piutang')"><i class='bx bx-trending-up'></i> Piutang Pelanggan</button>
        <button class="btn btn-secondary btn-sm tab-btn" data-tab="utang" onclick="switchTab('utang')"><i class='bx bx-trending-down'></i> Utang Supplier</button>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <div class="table-header">
          <div class="table-title" id="table-title"><i class='bx bx-trending-up' style="color:var(--success);margin-right:6px;"></i>Piutang Pelanggan</div>
          <div class="search-bar"><div class="search-icon"><i class='bx bx-search'></i></div><input type="text" placeholder="Cari nama..." id="search-input" oninput="handleSearch(this.value)"></div>
          <select class="form-control" style="width:130px;" id="f-status" onchange="loadData()">
            <option value="">Semua Status</option>
            <option value="pending">Belum Lunas</option>
            <option value="partial">Dibayar Sebagian</option>
            <option value="paid">Lunas</option>
            <option value="overdue">Jatuh Tempo</option>
          </select>
        </div>
        <div class="table-scroll"><table>
          <thead><tr id="table-head"></tr></thead>
          <tbody id="data-tbody"><tr><td colspan="8"><div class="table-empty"><i class='bx bx-loader-alt'></i><p>Memuat...</p></div></td></tr></tbody>
        </table></div>
        <div class="pagination"><div class="page-info" id="page-info">-</div><div class="page-btns" id="page-btns"></div></div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="debt-modal">
  <div class="modal">
    <div class="modal-header">
      <i class='bx bx-transfer-alt' style="color:var(--brand-light);font-size:22px;"></i>
      <div class="modal-title" id="modal-title">Catat Piutang/Utang</div>
      <button class="modal-close" onclick="closeModal()"><i class='bx bx-x'></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Tipe</label>
        <select class="form-control" id="d-type" onchange="updateModalType()">
          <option value="piutang">Piutang (Pelanggan berutang ke kita)</option>
          <option value="utang">Utang (Kita berutang ke supplier)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" id="d-party-label">Pelanggan</label>
        <select class="form-control" id="d-party"></select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label class="form-label">Jumlah (Rp) <span class="required">*</span></label>
          <input type="number" class="form-control" id="d-amount" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Jatuh Tempo</label>
          <input type="date" class="form-control" id="d-due">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Keterangan</label>
        <input type="text" class="form-control" id="d-desc" placeholder="No. invoice, keterangan...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" id="btn-save" onclick="saveDebt()"><i class='bx bx-save'></i> Simpan</button>
    </div>
  </div>
</div>

<!-- Payment Modal -->
<div class="modal-overlay" id="pay-modal">
  <div class="modal">
    <div class="modal-header">
      <i class='bx bx-money' style="color:var(--success);font-size:22px;"></i>
      <div class="modal-title">Bayar</div>
      <button class="modal-close" onclick="closePayModal()"><i class='bx bx-x'></i></button>
    </div>
    <div class="modal-body">
      <div style="background:var(--bg-elevated);border-radius:var(--r-lg);padding:14px;margin-bottom:14px;">
        <div style="font-size:0.78rem;color:var(--text-muted);">Sisa tagihan</div>
        <div class="font-display" style="font-size:1.4rem;font-weight:900;color:var(--brand-light);" id="pay-remaining">Rp 0</div>
      </div>
      <div class="form-group">
        <label class="form-label">Jumlah Bayar (Rp)</label>
        <input type="number" class="form-control" id="pay-amount" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Metode</label>
        <select class="form-control" id="pay-method">
          <option value="cash">Tunai</option>
          <option value="transfer">Transfer</option>
          <option value="giro">Giro</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Catatan</label>
        <input type="text" class="form-control" id="pay-note" placeholder="Referensi pembayaran...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closePayModal()">Batal</button>
      <button class="btn btn-success" id="btn-pay" onclick="processPayment()"><i class='bx bx-check'></i> Proses Pembayaran</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase.js?v=15"></script>
<script src="../js/app.js?v=17"></script>
<script src="../js/helpers.js?v=16"></script>
<script src="_sidebar.js?v=15"></script>
<script>
let currentTab='piutang', currentPage=1, perPage=20, editingId=null, payingId=null, searchTimeout=null;

(async()=>{ await requireAuth(); updateSidebarUser(); injectSidebar('utang-piutang.html'); await loadSummary(); switchTab('piutang'); })();

function handleSearch(v) { clearTimeout(searchTimeout); searchTimeout=setTimeout(()=>{currentPage=1;loadData();},350); }

function switchTab(tab) {
  currentTab = tab; currentPage = 1;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('btn-primary', b.dataset.tab===tab);
    b.classList.toggle('btn-secondary', b.dataset.tab!==tab);
  });
  const title = document.getElementById('table-title');
  if (tab==='piutang') title.innerHTML = "<i class='bx bx-trending-up' style='color:var(--success);margin-right:6px;'></i>Piutang Pelanggan";
  else title.innerHTML = "<i class='bx bx-trending-down' style='color:var(--danger);margin-right:6px;'></i>Utang Supplier";
  loadData();
}

async function loadSummary() {
  try {
    const { data: piutang } = await _sb.from('debts').select('amount,paid_amount,due_date,type').eq('type','piutang');
    const { data: utang } = await _sb.from('debts').select('amount,paid_amount,due_date,type').eq('type','utang');
    const totalPiutang = (piutang||[]).reduce((s,d)=>s+(d.amount-d.paid_amount),0);
    const totalUtang = (utang||[]).reduce((s,d)=>s+(d.amount-d.paid_amount),0);
    const today = getToday();
    const overdue = [...(piutang||[]),...(utang||[])].filter(d=>d.due_date&&d.due_date<today&&d.amount>d.paid_amount).length;
    document.getElementById('s-piutang').textContent = formatCurrency(totalPiutang);
    document.getElementById('s-utang').textContent = formatCurrency(totalUtang);
    document.getElementById('s-overdue').textContent = overdue;
  } catch(e) {}
}

async function loadData() {
  const search = document.getElementById('search-input').value.trim();
  const status = document.getElementById('f-status').value;
  const today  = getToday();

  let q = _sb.from('debts').select('*,customers(name),suppliers(name)',{count:'exact'})
    .eq('type',currentTab).order('created_at',{ascending:false});
  if (status==='paid') q=q.filter('paid_amount','gte','amount');
  else if (status==='pending') q=q.eq('paid_amount',0);
  else if (status==='partial') q=q.gt('paid_amount',0).lt('paid_amount','amount');
  else if (status==='overdue') q=q.lt('due_date',today).lt('paid_amount','amount');

  const from = (currentPage-1)*perPage;
  const { data, count } = await q.range(from,from+perPage-1);
  const rows = data||[];

  // Render head
  const thead = document.getElementById('table-head');
  thead.innerHTML = `<th>${currentTab==='piutang'?'Pelanggan':'Supplier'}</th><th>Jumlah</th><th>Sudah Dibayar</th><th>Sisa</th><th>Jatuh Tempo</th><th>Status</th><th>Aksi</th>`;

  const tbody = document.getElementById('data-tbody');
  if (!rows.length) { tbody.innerHTML='<tr><td colspan="7"><div class="table-empty"><i class="bx bx-transfer-alt"></i><p>Tidak ada data</p></div></td></tr>'; return; }

  tbody.innerHTML = rows.map(d => {
    const party = d.customers?.name || d.suppliers?.name || '-';
    const remaining = d.amount - (d.paid_amount||0);
    const isPaid = remaining <= 0;
    const isOverdue = d.due_date && d.due_date < today && !isPaid;
    const isPartial = d.paid_amount > 0 && !isPaid;
    const statusBadge = isPaid ? 'badge-success' : isOverdue ? 'badge-danger' : isPartial ? 'badge-warning' : 'badge-neutral';
    const statusLabel = isPaid ? 'Lunas' : isOverdue ? 'Jatuh Tempo' : isPartial ? 'Sebagian' : 'Belum Bayar';
    return `<tr>
      <td><div class="td-bold">${party}</div>${d.description?`<div style="font-size:0.72rem;color:var(--text-muted);">${d.description}</div>`:''}</td>
      <td class="td-bold">${formatCurrency(d.amount)}</td>
      <td class="text-success">${formatCurrency(d.paid_amount||0)}</td>
      <td class="${isPaid?'text-success':'text-danger'} td-bold">${formatCurrency(remaining)}</td>
      <td style="font-size:0.82rem;">${d.due_date?formatDate(d.due_date):'<span class="text-muted">-</span>'}</td>
      <td><span class="badge ${statusBadge}">${statusLabel}</span></td>
      <td>
        <div style="display:flex;gap:4px;">
          ${!isPaid?`<button class="btn btn-success btn-sm" style="font-size:0.75rem;padding:5px 10px;" onclick="openPayModal('${d.id}',${remaining})"><i class='bx bx-money'></i> Bayar</button>`:''}
          <button class="btn btn-icon btn-sm" style="background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bg);" onclick="deleteDebt('${d.id}')"><i class='bx bx-trash'></i></button>
        </div>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('page-info').textContent = `${formatNumber(count||0)} data · Hal ${currentPage}`;
}

function openModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Catat Piutang/Utang';
  document.getElementById('d-type').value = currentTab;
  document.getElementById('d-amount').value = '';
  document.getElementById('d-desc').value = '';
  document.getElementById('d-due').value = '';
  updateModalType();
  document.getElementById('debt-modal').classList.add('active');
}

async function updateModalType() {
  const type = document.getElementById('d-type').value;
  const label = document.getElementById('d-party-label');
  const sel = document.getElementById('d-party');
  label.textContent = type === 'piutang' ? 'Pelanggan' : 'Supplier';
  if (type === 'piutang') {
    const { data } = await _sb.from('customers').select('id,name').order('name');
    sel.innerHTML = '<option value="">-- Pilih Pelanggan --</option>' + (data||[]).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  } else {
    const { data } = await _sb.from('suppliers').select('id,name').order('name');
    sel.innerHTML = '<option value="">-- Pilih Supplier --</option>' + (data||[]).map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  }
}

async function saveDebt() {
  const amount = parseFloat(document.getElementById('d-amount').value)||0;
  if (!amount) { Toast.error('Jumlah harus diisi.'); return; }
  const type = document.getElementById('d-type').value;
  const party = document.getElementById('d-party').value;
  const btn = document.getElementById('btn-save');
  btn.disabled=true; btn.innerHTML='<div class="spin"></div>';
  const payload = {
    type, amount, paid_amount: 0,
    [type==='piutang'?'customer_id':'supplier_id']: party||null,
    due_date: document.getElementById('d-due').value||null,
    description: document.getElementById('d-desc').value||null,
  };
  try {
    await _sb.from('debts').insert(payload);
    Toast.success('Berhasil dicatat!');
    closeModal(); loadData(); loadSummary();
  } catch(e) { Toast.error(e.message||'Gagal menyimpan.'); }
  finally { btn.disabled=false; btn.innerHTML='<i class="bx bx-save"></i> Simpan'; }
}

function openPayModal(id, remaining) {
  payingId = id;
  document.getElementById('pay-remaining').textContent = formatCurrency(remaining);
  document.getElementById('pay-amount').value = remaining;
  document.getElementById('pay-note').value = '';
  document.getElementById('pay-method').value = 'cash';
  document.getElementById('pay-modal').classList.add('active');
}

async function processPayment() {
  const amount = parseFloat(document.getElementById('pay-amount').value)||0;
  if (!amount) { Toast.error('Jumlah bayar harus diisi.'); return; }
  const btn = document.getElementById('btn-pay');
  btn.disabled=true; btn.innerHTML='<div class="spin"></div>';
  try {
    const { data: d } = await _sb.from('debts').select('paid_amount').eq('id',payingId).single();
    const newPaid = (d?.paid_amount||0) + amount;
    await _sb.from('debts').update({ paid_amount: newPaid }).eq('id',payingId);
    Toast.success(`Pembayaran ${formatCurrency(amount)} berhasil!`);
    closePayModal(); loadData(); loadSummary();
  } catch(e) { Toast.error(e.message||'Gagal memproses.'); }
  finally { btn.disabled=false; btn.innerHTML='<i class="bx bx-check"></i> Proses Pembayaran'; }
}

function deleteDebt(id) {
  Modal.confirm('Hapus Catatan', 'Yakin ingin menghapus catatan ini?', async()=>{
    try { await _sb.from('debts').delete().eq('id',id); Toast.success('Dihapus.'); loadData(); loadSummary(); }
    catch(e) { Toast.error(e.message||'Gagal menghapus.'); }
  });
}

function closeModal() { document.getElementById('debt-modal')?.classList.remove('active'); }
function closePayModal() { document.getElementById('pay-modal')?.classList.remove('active'); }
</script>
</body>
</html>
