<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Penjualan — Tokku</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tokku">
  <meta name="theme-color" content="#7af957">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    .report-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
    .chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
    .top-product-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .top-product-item:last-child { border-bottom: none; }
    .rank-badge { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 800; flex-shrink: 0; }
  
    @media (max-width: 768px) {
      .laporan-grid { grid-template-columns: 1fr !important; }
      .filter-bar { flex-direction: column; gap: 8px; }
      .filter-bar > * { width: 100% !important; }
    }
  </style>
  <script>
    // Init theme sebelum render untuk hindari flash
    (function() {
      if (localStorage.getItem('tokku_theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      } else {
        document.documentElement.classList.remove('light-theme');
      }
      // Dengarkan perubahan tema dari tab/halaman lain (pengaturan)
      window.addEventListener('storage', function(e) {
        if (e.key === 'tokku_theme') {
          if (e.newValue === 'light') {
            document.documentElement.classList.add('light-theme');
          } else {
            document.documentElement.classList.remove('light-theme');
          }
        }
      });
      // BroadcastChannel untuk sinkronisasi tema antar halaman di tab yang sama
      try {
        var _themeChannel = new BroadcastChannel('tokku_theme_channel');
        _themeChannel.onmessage = function(e) {
          if (e.data && e.data.theme === 'light') {
            document.documentElement.classList.add('light-theme');
          } else {
            document.documentElement.classList.remove('light-theme');
          }
        };
      } catch(e) {}
    })();
  </script>

  <style>
    /* Tokku v2 patch — override legacy CSS vars */
    :root {
      --accent: var(--brand);
      --accent-light: var(--brand-light);
      --accent-glow: var(--brand-glow);
      --accent-border: var(--brand-border);
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --bg-primary: var(--bg-base);
      --bg-secondary: var(--bg-surface);
      --bg-tertiary: var(--bg-elevated);
      --bg-card: var(--bg-card);
      --success-bg: var(--success-bg);
      --warning-bg: var(--warning-bg);
      --danger-bg: var(--danger-bg);
      --info-bg: var(--info-bg);
      --border-strong: var(--border-md);
    }
  </style>
</head>
<body>
<div class="app-wrapper">
    <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" data-active="laporan.html">
  <main class="main-content">
    <header class="top-header">
      <button class="icon-btn" onclick="toggleSidebar()"><i class='bx bx-menu'></i></button>
      <div class="header-title"><h1>Laporan Penjualan</h1><p id="report-range">Memuat...</p></div>
      <div class="header-actions">
        <input type="date" id="date-from" class="form-control" style="width:155px;" onchange="loadReport()">
        <span style="color:var(--text-muted); font-size:0.8rem;">s/d</span>
        <input type="date" id="date-to" class="form-control" style="width:155px;" onchange="loadReport()">
        <button class="btn btn-sm" onclick="exportCSV()" style="background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-secondary);">Export CSV</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle tema"><i class='bx bx-moon'></i></button>
        </div>
    </header>

    <div class="page-content">
      <!-- KPI Cards -->
      <div class="stats-grid" style="margin-bottom:16px;">
        <div class="stat-card">
          <div class="stat-icon" style="background:var(--accent-glow);"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" style="width:20px;height:20px;"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
          <div class="stat-value" id="kpi-revenue">Rp 0</div><div class="stat-label">Total Pendapatan</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(34,197,94,0.1);"><svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" style="width:20px;height:20px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
          <div class="stat-value" id="kpi-profit">Rp 0</div><div class="stat-label">Estimasi Profit</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(6,182,212,0.1);"><svg viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" style="width:20px;height:20px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
          <div class="stat-value" id="kpi-count">0</div><div class="stat-label">Total Transaksi</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(139,92,246,0.1);"><svg viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" style="width:20px;height:20px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
          <div class="stat-value" id="kpi-customers">0</div><div class="stat-label">Pelanggan Unik</div>
        </div>
      </div>

      <!-- Chart & Top Products -->
      <div class="report-grid" style="margin-bottom:16px;">
        <div class="chart-card">
          <div style="font-weight:700; margin-bottom:16px;">📈 Grafik Penjualan Harian</div>
          <canvas id="sales-chart" height="120"></canvas>
        </div>
        <div class="chart-card">
          <div style="font-weight:700; margin-bottom:16px;">🏆 Produk Terlaris</div>
          <div id="top-products-list">
            <div style="text-align:center; padding:20px; color:var(--text-muted);">Memuat...</div>
          </div>
        </div>
      </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase.js?v=15"></script>
<script src="_sidebar.js?v=15"></script>
<script src="../js/app.js?v=17"></script>
<script>
  let salesChart = null;
  let reportData = [];

  async function init() {
    const ok = await requireAuth('laporan');
    if (!ok) return;
    const today = new Date().toISOString().split('T')[0];
    const firstDay = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
    document.getElementById('date-from').value = firstDay;
    document.getElementById('date-to').value = today;
    document.getElementById('exp-date').value = today;
    await loadReport();
  }

  async function loadReport() {
    const from = document.getElementById('date-from').value;
    const to = document.getElementById('date-to').value;
    if (!from || !to) return;
    document.getElementById('report-range').textContent = `${formatDate(from)} — ${formatDate(to)}`;
    try {
      const [sales, topProducts] = await Promise.all([
        KasirkuDB.Reports.getSalesReport(from + 'T00:00:00', to + 'T23:59:59'),
        KasirkuDB.Transactions.getTopProducts()
      ]);
      reportData = sales;
      updateKPIs(sales);
      renderChart(sales);
      renderTopProducts(topProducts);
    } catch(e) { Toast.error('Gagal memuat laporan'); }
  }

  function updateKPIs(sales) {
    const revenue = sales.reduce((s, t) => s + parseFloat(t.total_amount), 0);
    const customers = new Set(sales.filter(t => t.customers).map(t => t.customers?.name)).size;
    document.getElementById('kpi-revenue').textContent = formatRupiah(revenue);
    document.getElementById('kpi-profit').textContent = formatRupiah(revenue * 0.2); // estimasi 20%
    document.getElementById('kpi-count').textContent = formatNumber(sales.length);
    document.getElementById('kpi-customers').textContent = formatNumber(customers);
  }

  function renderChart(sales) {
    // Group by date
    const byDate = {};
    sales.forEach(t => {
      const d = t.created_at.split('T')[0];
      byDate[d] = (byDate[d] || 0) + parseFloat(t.total_amount);
    });
    const labels = Object.keys(byDate).sort();
    const values = labels.map(d => byDate[d]);
    if (salesChart) salesChart.destroy();
    salesChart = new Chart(document.getElementById('sales-chart'), {
      type: 'bar',
      data: {
        labels: labels.map(d => formatDate(d, 'short')),
        datasets: [{ label: 'Pendapatan', data: values, backgroundColor: 'rgba(122,249,87,0.5)', borderColor: '#7af957', borderWidth: 1.5, borderRadius: 4 }]
      },
      options: {
        responsive: true, plugins: { legend: { display: false } },
        scales: {
          y: { ticks: { callback: v => 'Rp' + formatNumber(v / 1000) + 'rb', color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } },
          x: { ticks: { color: '#64748b' }, grid: { display: false } }
        }
      }
    });
  }

  function renderTopProducts(products) {
    const el = document.getElementById('top-products-list');
    if (!products.length) { el.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Belum ada data</div>'; return; }
    const medals = ['🥇','🥈','🥉'];
    el.innerHTML = products.slice(0, 5).map((p, i) => `<div class="top-product-item">
      <div class="rank-badge" style="background:${i < 3 ? 'var(--accent-glow)' : 'var(--bg-elevated)'}; color:${i < 3 ? 'var(--accent)' : 'var(--text-muted)'};">${medals[i] || (i+1)}</div>
      <div style="flex:1; min-width:0;">
        <div style="font-weight:600; font-size:0.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.name}</div>
        <div style="font-size:0.72rem; color:var(--text-muted);">${formatNumber(p.total_qty_sold)} ${p.unit} terjual</div>
      </div>
      <div style="font-family:var(--font-display); font-size:0.85rem; font-weight:700; color:var(--accent-light);">${formatRupiah(p.total_revenue)}</div>
    </div>`).join('');
  }

  function renderExpenses(expenses) {
    const el = document.getElementById('expenses-list');
    if (!el) return;
    window._expensesCache = expenses;
    if (!expenses || !expenses.length) {
      el.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Belum ada pengeluaran</div>';
      return;
    }
    const total = expenses.reduce((s, e) => s + (e.amount || 0), 0);
    el.innerHTML = expenses.map(e => `
      <div style="display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);">
        <div style="flex:1; min-width:0;">
          <div style="font-weight:600; font-size:0.85rem;">${e.description || '-'}</div>
          <div style="font-size:0.75rem; color:var(--text-muted);">${e.category} · ${formatDate(e.date)}</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-weight:700; color:#ef4444;">${formatRupiah(e.amount)}</span>
          <button data-exp-id="${e.id}" data-action="edit" style="background:rgba(99,102,241,0.1); border:1px solid rgba(99,102,241,0.3); color:#818cf8; font-size:0.72rem; padding:3px 8px; border-radius:6px; cursor:pointer;">✏️ Edit</button>
          <button data-exp-id="${e.id}" data-action="delete" style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#f87171; font-size:0.72rem; padding:3px 8px; border-radius:6px; cursor:pointer;">🗑️</button>
        </div>
      </div>`).join('') +
      `<div style="display:flex; justify-content:space-between; padding-top:12px; font-weight:700; border-top:1px solid var(--border);">
        <span>Total Pengeluaran</span><span style="color:#ef4444;">${formatRupiah(total)}</span>
      </div>`;

    el.querySelectorAll('button[data-exp-id]').forEach(btn => {
      btn.addEventListener('click', function() {
        const id = this.getAttribute('data-exp-id');
        const action = this.getAttribute('data-action');
        if (action === 'edit') openEditExpense(id);
        else if (action === 'delete') deleteExpense(id);
      });
    });
  }


  let editExpenseId = null;

  function openEditExpense(id) {
    const expenses = window._expensesCache || [];
    const exp = expenses.find(e => e.id === id);
    if (!exp) return;
    editExpenseId = id;
    document.getElementById('edit-exp-desc').value = exp.description || '';
    document.getElementById('edit-exp-amount').value = exp.amount || '';
    document.getElementById('edit-exp-category').value = exp.category || 'operasional';
    document.getElementById('edit-exp-date').value = exp.date ? exp.date.split('T')[0] : getToday();
    Modal.show('modal-edit-expense');
  }

  async function saveEditExpense() {
    if (!editExpenseId) return;
    const desc = document.getElementById('edit-exp-desc').value.trim();
    const amount = parseFloat(document.getElementById('edit-exp-amount').value);
    if (!desc) { Toast.error('Keterangan wajib diisi'); return; }
    if (!amount || amount <= 0) { Toast.error('Jumlah harus lebih dari 0'); return; }
    const btn = document.getElementById('btn-edit-exp');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    try {
      await KasirkuDB.Reports.updateExpense(editExpenseId, {
        category: document.getElementById('edit-exp-category').value,
        description: desc, amount,
        date: document.getElementById('edit-exp-date').value
      });
      Toast.success('Pengeluaran berhasil diperbarui');
      Modal.hide('modal-edit-expense');
      editExpenseId = null;
      loadReport();
    } finally { btn.disabled = false; btn.textContent = 'Simpan'; }
  }

  async function deleteExpense(id) {
    Modal.confirm('Hapus Pengeluaran', 'Yakin ingin menghapus pengeluaran ini?', async () => {
      try {
        await KasirkuDB.Reports.deleteExpense(id);
        Toast.success('Pengeluaran dihapus');
        loadReport();
      } catch(e) { Toast.error('Gagal menghapus'); }
    });
  }

  function exportCSV() {
    if (!reportData.length) { Toast.warning('Tidak ada data'); return; }
    const rows = reportData.map(t => ({ Invoice: t.invoice_number, Tanggal: t.created_at, Pelanggan: t.customers?.name || 'Umum', Total: t.total_amount, Diskon: t.discount_amount, Pembayaran: t.payment_method }));
    const csv = [Object.keys(rows[0]).join(','), ...rows.map(r => Object.values(r).map(v => `"${v}"`).join(','))].join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `laporan-${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
    Toast.success('Laporan berhasil diexport');
  }

  init();
</script>

  <div id="sidebar-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:199;" onclick="closeSidebar()"></div>

  <!-- Modal Edit Pengeluaran -->
  <div id="modal-edit-expense" class="modal" style="display:none; position:fixed; inset:0; z-index:9000; align-items:center; justify-content:center; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px);">
    <div class="modal-box" style="background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:24px; width:100%; max-width:420px; margin:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:1.05rem; font-weight:700;">Edit Pengeluaran</h3>
        <button onclick="Modal.hide('modal-edit-expense')" style="background:none; border:none; color:var(--text-muted); font-size:1.4rem; cursor:pointer;">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div>
          <label style="font-size:0.78rem; font-weight:600; color:var(--text-muted); display:block; margin-bottom:4px;">Keterangan</label>
          <input id="edit-exp-desc" class="form-control" type="text" placeholder="Keterangan pengeluaran">
        </div>
        <div>
          <label style="font-size:0.78rem; font-weight:600; color:var(--text-muted); display:block; margin-bottom:4px;">Jumlah</label>
          <input id="edit-exp-amount" class="form-control" type="number" placeholder="0" min="0">
        </div>
        <div>
          <label style="font-size:0.78rem; font-weight:600; color:var(--text-muted); display:block; margin-bottom:4px;">Kategori</label>
          <select id="edit-exp-category" class="form-control">
            <option value="operasional">Operasional</option>
            <option value="gaji">Gaji</option>
            <option value="utilitas">Utilitas</option>
            <option value="lainnya">Lainnya</option>
          </select>
        </div>
        <div>
          <label style="font-size:0.78rem; font-weight:600; color:var(--text-muted); display:block; margin-bottom:4px;">Tanggal</label>
          <input id="edit-exp-date" class="form-control" type="date">
        </div>
        <button id="btn-edit-exp" class="btn btn-primary" onclick="saveEditExpense()">Simpan</button>
      </div>
    </div>
  </div>
</body>
</html>
