<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKU Master — Tokku</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
  <script>(function(){if(localStorage.getItem('tokku_theme')==='light')document.documentElement.classList.add('light-theme');})()</script>
</head>
<body>
<div class="app-wrapper">
  <main class="main-content">
    <header class="top-header">
      <button class="icon-btn" onclick="toggleSidebar()"><i class='bx bx-menu'></i></button>
      <div class="header-title">
        <h1>SKU Master</h1>
        <p>Kelola produk induk dan eceran</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" onclick="exportExcel()"><i class='bx bx-export'></i> Export</button>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()"><i class='bx bx-plus'></i> Tambah Produk</button>
      </div>
    </header>

    <div class="page-content">
      <div class="table-wrap">
        <div class="table-header">
          <div class="table-title"><i class='bx bx-package' style="color:var(--brand-light);margin-right:6px;"></i>Daftar SKU</div>
          <div class="search-bar">
            <div class="search-icon"><i class='bx bx-search'></i></div>
            <input type="text" placeholder="Cari nama atau SKU..." id="search-input" oninput="handleSearch(this.value)">
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Produk</th>
                <th>SKU</th>
                <th>Kategori</th>
                <th>Modal</th>
                <th>Min. Jual</th>
                <th>Std. Jual</th>
                <th>Stok</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="product-tbody">
              <tr><td colspan="8" class="table-empty"><i class='bx bx-loader-alt'></i><p>Memuat produk...</p></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal Tambah/Edit Produk -->
<div class="modal-overlay" id="product-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Tambah Produk</div>
      <button class="modal-close" onclick="closeModal('product-modal')"><i class='bx bx-x'></i></button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="form-group">
          <label class="form-label">Nama Produk <span class="required">*</span></label>
          <input type="text" class="form-control" id="p-name" placeholder="Nama produk">
        </div>
        <div class="form-group">
          <label class="form-label">SKU</label>
          <input type="text" class="form-control" id="p-sku" placeholder="SKU-XXXX">
        </div>
        <div class="form-group">
          <label class="form-label">Produk Induk (Opsional)</label>
          <select class="form-control" id="p-parent">
            <option value="">-- Bukan Produk Eceran --</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Kategori</label>
          <select class="form-control" id="p-category"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Harga Modal</label>
          <input type="number" class="form-control" id="p-cost" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Harga Jual Minimum</label>
          <input type="number" class="form-control" id="p-min-price" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Harga Jual Standard</label>
          <input type="number" class="form-control" id="p-std-price" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Stok</label>
          <input type="number" class="form-control" id="p-stock" placeholder="0">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('product-modal')">Batal</button>
      <button class="btn btn-primary" onclick="saveProduct()">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js?v=17"></script>
<script src="_sidebar.js"></script>
<script>
let products = [], categories = [], editingId = null;

(async () => {
  await requireAuth();
  injectSidebar('produk.html');
  await loadCategories();
  await loadProducts();
})();

async function loadCategories() {
  const { data } = await _sb.from('categories').select('*');
  categories = data || [];
  document.getElementById('p-category').innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

async function loadProducts() {
  const { data } = await _sb.from('products').select('*, categories(name)').eq('is_active', true);
  products = data || [];
  renderTable(products);
  document.getElementById('p-parent').innerHTML = '<option value="">-- Bukan Produk Eceran --</option>' + 
    products.filter(p => !p.parent_id).map(p => `<option value="${p.id}">${p.name}</option>`).join('');
}

function renderTable(rows) {
  const tbody = document.getElementById('product-tbody');
  tbody.innerHTML = rows.map(p => `
    <tr>
      <td>${p.name}</td>
      <td>${p.sku || '-'}</td>
      <td>${p.categories?.name || '-'}</td>
      <td>${formatCurrency(p.cost_price)}</td>
      <td>${formatCurrency(p.min_selling_price)}</td>
      <td>${formatCurrency(p.standard_selling_price)}</td>
      <td>${p.stock}</td>
      <td>
        <button class="btn btn-sm" onclick="editProduct('${p.id}')">Edit</button>
      </td>
    </tr>
  `).join('');
}

function openAddModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Tambah Produk';
  document.getElementById('product-modal').classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

async function saveProduct() {
  const payload = {
    name: document.getElementById('p-name').value,
    sku: document.getElementById('p-sku').value,
    parent_id: document.getElementById('p-parent').value || null,
    category_id: document.getElementById('p-category').value,
    cost_price: document.getElementById('p-cost').value,
    min_selling_price: document.getElementById('p-min-price').value,
    standard_selling_price: document.getElementById('p-std-price').value,
    stock: document.getElementById('p-stock').value
  };
  
  if (editingId) {
    await KasirkuDB.Products.update(editingId, payload);
  } else {
    await KasirkuDB.Products.create(payload);
  }
  closeModal('product-modal');
  loadProducts();
}

async function editProduct(id) {
  editingId = id;
  const p = products.find(x => x.id === id);
  document.getElementById('p-name').value = p.name;
  document.getElementById('p-sku').value = p.sku || '';
  document.getElementById('p-parent').value = p.parent_id || '';
  document.getElementById('p-category').value = p.category_id || '';
  document.getElementById('p-cost').value = p.cost_price;
  document.getElementById('p-min-price').value = p.min_selling_price;
  document.getElementById('p-std-price').value = p.standard_selling_price;
  document.getElementById('p-stock').value = p.stock;
  document.getElementById('modal-title').textContent = 'Edit Produk';
  document.getElementById('product-modal').classList.add('active');
}
</script>
</body>
</html>
